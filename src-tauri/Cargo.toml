[package]
name = "virtual-beat-battle"
version = "0.1.1"
description = "虛擬音鬥樂：虛擬台麻館的角色們打魔王的 6 鍵下落式節奏遊戲"
edition = "2021"
rust-version = "1.89"
default-run = "virtual-beat-battle"

[lib]
name = "virtual_beat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "beat-server"
path = "src/bin/beat-server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
beat-core = { path = "../crates/beat-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# 區網房間伺服器（Virtual 系列共用）
virtual-lan = { git = "https://github.com/YuutaTsubasa/VirtualCore", tag = "v0.6.0" }
