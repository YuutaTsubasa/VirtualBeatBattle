[package]
name = "beat-wasm"
version = "0.1.0"
description = "虛擬音鬥樂的網頁版引擎：把判定與房間包成 WebAssembly，在瀏覽器裡跑"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
beat-core = { path = "../beat-core" }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
